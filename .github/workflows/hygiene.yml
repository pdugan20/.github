# Reusable workflow hygiene check for pdugan20 and nxt-up repositories.
#
# Call it from a repository workflow, pinned to a commit SHA:
#
#   jobs:
#     hygiene:
#       uses: pdugan20/.github/.github/workflows/hygiene.yml@<sha> # v1.0.0
#
# It runs actionlint, zizmor (medium severity and above), and Gitleaks over the
# commits a pull request or push adds. Repository-local .github/zizmor.yml and
# .gitleaks.toml files are honored for documented exceptions.

name: Workflow hygiene

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/hygiene-bin"
          mkdir -p "$tool_dir"
          install_tool() {
            local name=$1 url=$2 checksum=$3 member=${4:-$1}
            local archive="$RUNNER_TEMP/$name.tar.gz"
            local extract_dir="$RUNNER_TEMP/$name"
            curl --fail --silent --show-error --location "$url" --output "$archive"
            echo "$checksum  $archive" | sha256sum --check
            mkdir -p "$extract_dir"
            tar -xzf "$archive" -C "$extract_dir" "$member"
            install -m 0755 "$extract_dir/${member#./}" "$tool_dir/$name"
          }
          install_tool actionlint \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          install_tool zizmor \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
          install_tool gitleaks \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          echo "$tool_dir" >>"$GITHUB_PATH"

      - name: Lint workflows (actionlint)
        run: actionlint

      - name: Audit workflow security (zizmor)
        run: zizmor --offline --min-severity medium --format github .

      - name: Scan new commits for secrets (Gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ $EVENT_NAME == pull_request* && -n $PR_BASE ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ -n ${PUSH_BEFORE:-} && ! $PUSH_BEFORE =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$CURRENT_SHA"
          else
            range="-1 $CURRENT_SHA"
          fi
          echo "Scanning commits: $range"
          gitleaks git --no-banner --redact --log-opts="$range" .
